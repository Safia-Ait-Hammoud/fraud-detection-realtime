# spark/config/spark-defaults.conf
# ---------------------------------------------------------
# Configuration par défaut du moteur Apache Spark
# ---------------------------------------------------------

# 1. Allocation des ressources (Adapté pour une machine locale)
spark.driver.memory                  2g
spark.executor.memory                2g

# 2. Optimisation des performances Streaming / SQL
# (Par défaut Spark crée 200 partitions pour les jointures SQL. 
# En local sur des petits batches, ça ralentit tout. On réduit à 2 ou 4).
spark.sql.shuffle.partitions         2
spark.default.parallelism            2

# 3. Sécurité et robustesse du Streaming
# (Indispensable : demande à Spark de finir de traiter son micro-batch 
# en cours avant de s'éteindre si on fait un CTRL+C, pour ne pas perdre de données Kafka).
spark.streaming.stopGracefullyOnShutdown true

# 4. Nettoyage et Logs
# Nettoie les métadonnées de l'interface graphique Spark UI pour éviter de saturer la RAM
spark.ui.retainedJobs                50
spark.ui.retainedStages              50

# 5. Connecteurs natifs (Optionnel ici car on l'a mis dans le code Python, 
# mais c'est la bonne pratique de le déclarer au niveau du moteur)
spark.jars.packages                  org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,com.google.cloud.spark:spark-bigquery-with-dependencies_2.12:0.34.0