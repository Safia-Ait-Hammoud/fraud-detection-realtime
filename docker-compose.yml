version: '3.8'

# ============================================================
# Détection de Fraude Bancaire - Architecture de Production
# ============================================================

networks:
  fraud-net:
    driver: bridge

volumes:
  zookeeper-data:
  kafka-data:
  prometheus-data:
  grafana-data:

services:
  # --------------------------------------------------------
  # 1. COUCHE MESSAGING (Zookeeper & Kafka)
  # --------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - fraud-net
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    networks:
      - fraud-net
    ports:
      - "9092:9092"
      - "29092:29092"
      - "7071:7071"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OPTS: "-javaagent:/usr/share/jmx_exporter/jmx_prometheus_javaagent-0.18.0.jar=7071:/etc/jmx-exporter/kafka-2_0_0.yml"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./monitoring/exporters:/usr/share/jmx_exporter
      - ./monitoring/exporters/config:/etc/jmx-exporter
    restart: on-failure

  # --------------------------------------------------------
  # 2. COUCHE APPLICATIVE (Notre API FastAPI)
  # --------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: docker/Dockerfile.api
    container_name: fraud-api
    networks:
      - fraud-net
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcp-credentials.json
    volumes:
      - ./config:/app/config:ro

  # --------------------------------------------------------
  # 3. COUCHE OBSERVABILITÉ (Prometheus, Pushgateway & Grafana)
  # --------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: pushgateway
    networks:
      - fraud-net
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    depends_on:
      - pushgateway
    networks:
      - fraud-net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    depends_on:
      - prometheus
    networks:
      - fraud-net
    ports:
      - "3002:3000" 
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=fraud2024!
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

  producer:
    build:
      context: .
      dockerfile: kafka/docker/Dockerfile.producer
    container_name: fraud-producer
    depends_on:
      - kafka
    networks:
      - fraud-net
    environment:
      - KAFKA_BROKER=kafka:9092
    restart: on-failure

  spark-streaming:
    build:
      context: .
      dockerfile: spark/docker/Dockerfile.spark
    container_name: fraud-spark
    depends_on:
      - kafka
      - pushgateway
    networks:
      - fraud-net
    environment:
      - KAFKA_BROKER=kafka:9092
      - GOOGLE_APPLICATION_CREDENTIALS=/app/config/gcp-credentials.json
    volumes:
      - ./config:/app/config:ro
    restart: on-failure