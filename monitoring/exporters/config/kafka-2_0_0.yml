lowercaseOutputName: true
rules:
  # Filtre spécifique pour remonter les messages entrants et le débit réseau (BytesInPerSec)
  - pattern: kafka.server<type=(.+), name=(.+), topic=(.+)><>Count
    name: kafka_server_$1_$2_total
    type: COUNTER
    labels:
      topic: "$3"
  
  # Filtre pour le lag des consommateurs et l'état des partitions
  - pattern: kafka.server<type=(.+), name=(.+), topic=(.+), partition=(.+)><>Value
    name: kafka_server_$1_$2
    type: GAUGE
    labels:
      topic: "$3"
      partition: "$4"
  
  # Capture de toutes les autres métriques génériques de Kafka
  - pattern: ".*"