---
name: Security — Scan Images & Code

'on':
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

jobs:
  # ════════════════════════════════════════════════════════════
  # Trivy — scan Docker images for CVEs
  # ════════════════════════════════════════════════════════════
  trivy-scan:
    name: Trivy Image Scan — ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        service: [api-rest, spark, kafka]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image for scanning
        run: |
          docker build \
            -t fraud-detection/${{ matrix.service }}:scan \
            ./${{ matrix.service }}

      - name: Run Trivy — table output (visible in logs)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fraud-detection/${{ matrix.service }}:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Run Trivy — save SARIF artifact
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fraud-detection/${{ matrix.service }}:scan
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-${{ matrix.service }}-sarif
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # Secret scanning — make sure no creds are committed
  # ════════════════════════════════════════════════════════════
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          